name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            destination: generic/platform=iOS Simulator
          - name: macOS
            destination: platform=macOS
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          xcodebuild \
            -project fmhy.xcodeproj \
            -scheme fmhy \
            -configuration Debug \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            build

  test:
    name: Unit tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: |
          xcodebuild test \
            -project fmhy.xcodeproj \
            -scheme fmhy \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

  validate:
    name: Validate scripts and source feed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check shell scripts parse
        run: |
          for script in scripts/*.sh; do
            bash -n "$script"
            echo "ok $script"
          done

      - name: Check Python helpers compile
        run: |
          for script in scripts/*.py; do
            python3 -c "compile(open('$script').read(), '$script', 'exec')"
            echo "ok $script"
          done

      - name: Check the site matches the feed
        run: python3 scripts/make-site.py --check

      - name: Check AltStore feed
        run: |
          python3 - <<'PY'
          import json

          feed = json.load(open("docs/apps.json"))
          apps = feed["apps"]
          required = {
              "name", "bundleIdentifier", "developerName", "localizedDescription",
              "version", "buildVersion", "versionDate", "downloadURL",
              "size", "minOSVersion",
          }
          assert apps, "feed has no apps"
          for app in apps:
              assert "versions" not in app, f"{app.get('version')} still uses a versions[] array"
              missing = required - app.keys()
              assert not missing, f"{app.get('version')} is missing {sorted(missing)}"
          dates = [app["versionDate"] for app in apps]
          assert dates == sorted(dates, reverse=True), "feed is not newest-first"
          versions = [app["version"] for app in apps]
          assert len(set(versions)) == len(versions), f"duplicate versions: {versions}"
          print(f"feed ok: {len(apps)} versions", versions)
          PY
