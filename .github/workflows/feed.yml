name: Feed

# The AltStore feed and the site generated from it. Runs when docs/ or the
# generator changes, so a stale page or a bad news caption fails on its own
# instead of turning the app's checks red.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/make-site.py'
      - 'scripts/make-altstore-source.py'
      - '.github/workflows/feed.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/make-site.py'
      - 'scripts/make-altstore-source.py'
      - '.github/workflows/feed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check the feed and the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site matches the feed
        run: python3 scripts/make-site.py --check

      - name: Check AltStore feed
        run: |
          python3 - <<'PY'
          import json

          feed = json.load(open("docs/apps.json"))
          apps = feed["apps"]
          required = {
              "name", "bundleIdentifier", "developerName", "localizedDescription",
              "version", "buildVersion", "versionDate", "downloadURL",
              "size", "minOSVersion",
          }
          assert apps, "feed has no apps"
          for app in apps:
              assert "versions" not in app, f"{app.get('version')} still uses a versions[] array"
              missing = required - app.keys()
              assert not missing, f"{app.get('version')} is missing {sorted(missing)}"
          dates = [app["versionDate"] for app in apps]
          assert dates == sorted(dates, reverse=True), "feed is not newest-first"
          versions = [app["version"] for app in apps]
          assert len(set(versions)) == len(versions), f"duplicate versions: {versions}"

          news = feed.get("news", [])
          for item in news:
              missing = {"title", "identifier", "caption", "date"} - item.keys()
              assert not missing, f"news item {item.get('title')} is missing {sorted(missing)}"
              assert "(+" not in item["caption"], \
                  f"news item {item.get('title')} still carries a commit-subject caption"
          identifiers = [item["identifier"] for item in news]
          assert len(set(identifiers)) == len(identifiers), f"duplicate news identifiers: {identifiers}"

          print(f"feed ok: {len(apps)} versions, {len(news)} news items", versions)
          PY
