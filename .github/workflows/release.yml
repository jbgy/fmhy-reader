name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish IPA
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        env:
          VERSION_OVERRIDE: ${{ github.ref_name }}
          BUILD_NUMBER_OVERRIDE: ${{ github.run_number }}
        run: |
          ./scripts/build-ipa.sh
          cp build/FMHY-*-unsigned.ipa build/FMHY.ipa

      - name: Build macOS app
        env:
          VERSION_OVERRIDE: ${{ github.ref_name }}
          BUILD_NUMBER_OVERRIDE: ${{ github.run_number }}
        run: ./scripts/build-macos.sh

      # Notes come from the commits since the previous tag, so the release and
      # the feed describe what changed instead of repeating install steps.
      - name: Draft release notes
        run: |
          PREV=$(git describe --tags --abbrev=0 "${{ github.ref_name }}^" 2>/dev/null \
            || git rev-list --max-parents=0 HEAD)
          python3 scripts/release-notes.py --from "$PREV" --to "${{ github.ref_name }}" \
            --format markdown > build/notes.md
          python3 scripts/release-notes.py --from "$PREV" --to "${{ github.ref_name }}" \
            --format plain > build/notes.txt
          cat build/notes.md

      # The feed entry is generated on top of main rather than on the tag, so a
      # release never conflicts with an earlier one that already pushed a feed
      # commit (the tag itself may lag behind main).
      - name: Update the feed on main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout -B release-feed origin/main
          python3 scripts/make-altstore-source.py \
            --ipa build/FMHY.ipa \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}" \
            --notes-file build/notes.txt
          git add docs/apps.json
          git commit -m "chore(release): publish ${{ github.ref_name }}"
          git push origin release-feed:main

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN_OS=$(python3 -c "import json;print(json.load(open('docs/apps.json'))['apps'][0]['minOSVersion'])")
          {
            cat build/notes.md
            printf '\n---\n\n'
            printf 'Unsigned IPA for iOS %s or later. Install with AltStore, SideStore, Feather, ESign or Sideloadly.\n\n' "$MIN_OS"
            printf '**macOS:** unzip `FMHY-macOS.zip`, drag `FMHY.app` into Applications, then right-click → Open the first time.\n\n'
            printf '**Source feed:** https://raw.githubusercontent.com/%s/refs/heads/main/docs/apps.json\n' "${{ github.repository }}"
          } > build/release-body.md
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              build/FMHY.ipa build/FMHY-macOS.zip docs/apps.json --clobber
            gh release edit "${{ github.ref_name }}" --notes-file build/release-body.md
          else
            gh release create "${{ github.ref_name }}" \
              build/FMHY.ipa \
              build/FMHY-macOS.zip \
              docs/apps.json \
              --title "FMHY ${GITHUB_REF_NAME#v}" \
              --notes-file build/release-body.md
          fi

      - name: Check the feed is live
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/docs/apps.json"
          WANT=$(python3 -c "import json;print(json.load(open('docs/apps.json'))['apps'][0]['buildVersion'])")
          GOT=0
          for attempt in $(seq 1 30); do
            GOT=$(curl -fsS "$URL" | python3 -c "import json,sys;a=json.load(sys.stdin)['apps'];print(a[0]['buildVersion'] if a else 0)" || echo 0)
            if [ "$GOT" = "$WANT" ]; then
              echo "feed live, serving build $GOT"
              exit 0
            fi
            echo "attempt $attempt: feed at build $GOT, want $WANT"
            sleep 10
          done
          echo "::error::feed still serving build $GOT after 5 minutes"
          exit 1
