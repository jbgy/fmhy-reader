name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish IPA
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned IPA
        env:
          VERSION_OVERRIDE: ${{ github.ref_name }}
          BUILD_NUMBER_OVERRIDE: ${{ github.run_number }}
        run: |
          ./scripts/build-ipa.sh
          cp build/FMHY-*-unsigned.ipa build/FMHY.ipa

      - name: Build macOS app
        env:
          VERSION_OVERRIDE: ${{ github.ref_name }}
          BUILD_NUMBER_OVERRIDE: ${{ github.run_number }}
        run: ./scripts/build-macos.sh

      - name: Update AltStore source feed
        run: |
          python3 scripts/make-altstore-source.py \
            --ipa build/FMHY.ipa \
            --repo "${{ github.repository }}" \
            --tag "${{ github.ref_name }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MIN_OS=$(python3 -c "import json;print(json.load(open('docs/apps.json'))['apps'][0]['versions'][0]['minOSVersion'])")
          gh release create "${{ github.ref_name }}" \
            build/FMHY.ipa \
            build/FMHY-macOS.zip \
            docs/apps.json \
            --title "FMHY ${{ github.ref_name }}" \
            --notes "Unsigned IPA for AltStore, SideStore, Feather, ESign and Sideloadly. Requires iOS ${MIN_OS} or later.

          macOS: unzip FMHY-macOS.zip, then drag FMHY.app into Applications (right-click to open the first time).

          Add the source once and update from there: https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/docs/apps.json"

      - name: Check the feed is live
        run: |
          URL="https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/main/docs/apps.json"
          WANT=$(python3 -c "import json;print(json.load(open('docs/apps.json'))['apps'][0]['versions'][0]['buildVersion'])")
          GOT=0
          for attempt in $(seq 1 12); do
            GOT=$(curl -fsS "$URL" | python3 -c "import json,sys;v=json.load(sys.stdin)['apps'][0]['versions'];print(v[0]['buildVersion'] if v else 0)" || echo 0)
            if [ "$GOT" = "$WANT" ]; then
              echo "feed live, serving build $GOT"
              exit 0
            fi
            echo "attempt $attempt: feed at build $GOT, want $WANT"
            sleep 10
          done
          echo "::error::feed still serving build $GOT after 2 minutes"
          exit 1

      - name: Commit updated feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout main
          git add docs/apps.json
          if git diff --cached --quiet; then
            echo "feed unchanged"
          else
            git commit -m "chore(release): publish ${{ github.ref_name }}"
            git push origin main
          fi
